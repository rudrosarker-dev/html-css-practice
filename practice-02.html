<!DOCTYPE html>
<html>
<head>
  <style>
    .Amazon-lnk {
      color: rgb(0, 113, 133);
    }

    .Amazon-lnk:hover {
      color: rgb(255, 164, 28);
    }

    .Nike {
      color: black;
      font-size: 24px;
      font-weight: bold;
    }

    .Stock {
      color: rgb(0, 118, 0);
      font-size: 18px;
      font-weight: bold;
    }

    .Free {
      font-size: 15px;
    }

    .Add {
      background-color: rgb(255, 216, 20);
      color: black;
      font-size: 15px;
      width: 150px;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

    .Add:hover {
      background-color: rgb(247, 202, 0);
    }

    .Add:active {
      opacity: 0.5;
    }

    .Buy {
      background-color: rgb(255, 164, 28);
      border: none;
      border-radius: 20px;
      width: 150px;
      padding: 10px 20px;
      margin-left: 15px;
    }

    .Buy:hover {
      background-color: rgb(245, 140, 18);
    }
    
    .Buy:active {
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <a class="Amazon-lnk" href="https://www.amazon.com/" target="_blank">
    Back to Amazon
  </a>

  <p class="Nike">
    Nike Black Running Shoes
  </p>

  <p class="Stock">
    $39 - in stock.
  </p>

  <p class="Free">
    Free delivery tomorrow.
  </p>

  <button class="Add">
    Add to Cart
  </button>

  <button class="Buy">
    Buy now
  </button>

</body>
</html>
